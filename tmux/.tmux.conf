# ====== General Settings ======
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 10000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on
set -g focus-events on

# Prefix key
set -g prefix C-b
unbind C-a

# Split panes
bind | split-window -h
bind - split-window -v

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane resize with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ====== Clipboard Integration ======
# Uses ~/.local/bin/tmux-yank which tries:
#   1. OSC 52 (works over SSH to iTerm2, Kitty, Alacritty, WezTerm)
#   2. xclip (local X11)
#   3. wl-copy (local Wayland)
# set-clipboard on also enables native tmux OSC 52 as a secondary path.

# Copy selection to clipboard: y (yank and cancel), Enter (yank and cancel), Y (yank without cancel)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"
bind -T copy-mode-vi Y send-keys -X copy-pipe "~/.local/bin/tmux-yank"

# Mouse drag selection copies to clipboard on release
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"

# ====== Catppuccin Mocha Colors ======
# Base:       #1e1e2e  Mantle:     #181825  Crust:      #11111b
# Text:       #cdd6f4  Subtext0:   #a6adc8  Overlay0:   #6c7086
# Surface0:   #313244  Surface1:   #45475a  Surface2:   #585b70
# Blue:       #89b4fa  Lavender:   #b4befe  Mauve:      #cba6f7
# Green:      #a6e3a1  Teal:       #94e2d5  Sky:        #89dceb
# Yellow:     #f9e2af  Peach:      #fab387  Maroon:     #eba0ac
# Red:        #f38ba8  Pink:       #f5c2e7  Rosewater:  #f5e0dc

# ====== Window Renaming ======
setw -g automatic-rename off        # Don't let tmux override with command name

# Save custom name when user renames with ctrl+,
bind , command-prompt -p "Window name:" { set -w @user_name "%%" ; rename-window "%%" }

# ====== Tmux Plugin Manager ======
set -g @plugin 'tmux-plugins/tpm'

# CPU/memory data provider (needed by catppuccin modules)
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @cpu_percentage_format "%2.1f%%"
set -g @ram_percentage_format "%2.1f%%"

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Window style: number + name | command
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#{?#{!=:#{@user_name},},#{@user_name} | ,}#T"
set -g @catppuccin_window_current_text "#{?#{!=:#{@user_name},},#{@user_name} | ,}#T"

set -g @catppuccin_date_time "%H:%M"
set -g @catppuccin_status_background "default"

# ====== Status Line ======
set -g status-position top
set -g status-justify left
set -g status-interval 2

# --- Line 1 (bottom): Current directory and git branch ---
set -g status-format[1] "\
#[bg=#181825,fg=#a6adc8]\
  #{s|$HOME|~|:#{pane_current_path}} \
#[fg=#f9e2af] #(cd #{pane_current_path} 2>/dev/null && git symbolic-ref --short HEAD 2>/dev/null || echo '') \
#[align=right]\
#[fg=#585b70]#{?#{!=:#{client_session},#{session_name}},(#{session_name}),}"

# Override cpu/ram text to call tmux-cpu scripts directly
# (catppuccin stores #{l:#{cpu_percentage}} which never resolves)
set -g @catppuccin_cpu_text "#(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_ram_text "#(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)"

# ====== TPM (Tmux Plugin Manager) ======
run '~/.tmux/plugins/tpm/tpm'

# Build status line after plugins load
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_cpu} #{E:@catppuccin_status_ram} #{E:@catppuccin_status_date_time}"